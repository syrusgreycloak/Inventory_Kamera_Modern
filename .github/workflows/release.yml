# Builds a release when a version tag (v2.0.0, v2.0.1-beta.1, ...) is pushed:
# tests, a self-contained Windows build, a zip, and a DRAFT GitHub release with the zip attached.
# Review the draft on GitHub (Releases), tick "pre-release" if wanted, then publish it.
#
# "Run workflow" on the Actions tab builds the same zip without a release (download it from the run).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the draft release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version from tag
        id: version
        shell: pwsh
        run: |
          # v2.0.0-beta.1 -> 2.0.0; manual runs keep the version in the project file
          $ref = '${{ github.ref_name }}'
          $m = [regex]::Match($ref, '\d+(\.\d+){1,3}')
          if ('${{ github.ref_type }}' -eq 'tag' -and $m.Success) { $v = $m.Value } else { $v = '' }
          "number=$v" >> $env:GITHUB_OUTPUT
          $name = if ($v) { $ref } else { 'build-' + '${{ github.sha }}'.Substring(0, 7) }
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Test
        run: |
          dotnet test InventoryKamera.Tests/InventoryKamera.Tests.csproj -c Release
          dotnet test InventoryKamera.Infrastructure.Tests/InventoryKamera.Infrastructure.Tests.csproj -c Release

      - name: Publish (self-contained, win-x64)
        shell: pwsh
        run: |
          $versionArgs = @()
          if ('${{ steps.version.outputs.number }}') { $versionArgs = @("-p:Version=${{ steps.version.outputs.number }}") }
          dotnet publish InventoryKamera.Avalonia/InventoryKamera.Avalonia.csproj `
            -c Release -f net8.0-windows -r win-x64 --self-contained true -o publish @versionArgs

      - name: Add the Visual C++ runtime
        shell: pwsh
        run: |
          # The OCR engine's native DLLs (x64/leptonica, x64/tesseract55) need these, and a clean
          # Windows doesn't have them: the app then can't start ("Failed to find library
          # 'leptonica-1.85.0.dll'"). Windows looks for a DLL's dependencies in the exe's folder
          # first, so ship them there (app-local deployment, allowed by the VC++ redistributable
          # license), from Visual Studio's redistributable folder on the build machine.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" -Directory |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw "Visual C++ redistributable folder not found under $vs" }
          Write-Host "Copying the runtime from $($crt.FullName)"
          foreach ($dll in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll') {
            Copy-Item (Join-Path $crt.FullName $dll) publish\ -ErrorAction Stop
          }

      - name: Zip
        shell: pwsh
        run: |
          Remove-Item publish\*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path publish\* -DestinationPath "InventoryKameraModern-${{ steps.version.outputs.name }}-win-x64.zip"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: InventoryKameraModern-${{ steps.version.outputs.name }}-win-x64
          path: InventoryKameraModern-*.zip

      - name: Draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create '${{ github.ref_name }}' (Get-Item InventoryKameraModern-*.zip).FullName `
            --draft --generate-notes --title 'Inventory Kamera Modern ${{ github.ref_name }}'
